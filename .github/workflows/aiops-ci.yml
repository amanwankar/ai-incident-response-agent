name: AIOps — Local Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    name: React TypeScript production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  docker:
    name: Build only (no push, no cloud deployment)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t aiops-backend:ci .
      - name: Build dashboard image
        run: docker build -f dashboard/Dockerfile -t aiops-dashboard:ci dashboard
      - name: Validate Compose syntax without actual credentials
        env:
          AIOPS_DB_PASSWORD: dummy-ci-password-not-used
        run: docker compose -f deploy/compose.final.yaml config -q
