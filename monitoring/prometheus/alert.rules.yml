groups:
  - name: fastapi-alerts
    rules:
      - alert: FastAPIDown
        expr: up{job="fastapi"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "FastAPI application is down"
          description: "Prometheus cannot scrape FastAPI for 30 seconds."

      - alert: FastAPIHighErrorRate
        expr: sum(increase(http_server_errors_total[1m])) > 3
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "FastAPI is returning too many server errors"
          description: "More than 3 HTTP 5xx errors occurred in the last minute."
