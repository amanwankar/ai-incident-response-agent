
name: aiops-backend-lab

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      DB_HOST: aiops-postgres
      DB_PORT: "5432"
      DB_NAME: incident_db
      DB_USER: aiops

      AIOPS_DB_PASSWORD: ${AIOPS_DB_PASSWORD:?Database password required}

      PROMETHEUS_URL: http://prometheus:9090
      OLLAMA_URL: http://host.docker.internal:11434

    volumes:
      - ./logs:/app/logs:ro

    networks:
      - aiops-network

networks:
  aiops-network:
    external: true
    name: aiops-network
